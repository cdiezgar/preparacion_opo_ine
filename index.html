    // 6. DETECCIÓN AUTOMÁTICA DE PREGUNTAS EN BANCO
    async function detectarTemasConPreguntas() {
      const mapa = new Map();
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('preguntas')
            .select('tema_num');
          if (!error && data) {
            data.forEach(p => {
              if (p.tema_num) {
                mapa.set(p.tema_num, (mapa.get(p.tema_num) || 0) + 1);
              }
            });
          }
        } catch (e) {
          console.warn("Fallo consultando preguntas:", e);
        }
      }

      if (mapa.size === 0) {
        MOCK_PREGUNTAS.forEach(p => {
          mapa.set(p.tema_num, (mapa.get(p.tema_num) || 0) + 1);
        });
      }

      state.temasConPreguntas = mapa;
      
      if (state.currentView === 'home') {
        const vp = document.getElementById('app-viewport');
        if (vp) renderHome(vp);
      } else if (state.currentView === 'test-center') {
        const vp = document.getElementById('app-viewport');
        if (vp) renderTestCenter(vp);
      }
    }

    // 7. MOTOR DE CONSULTA DE PREGUNTAS
    async function obtenerPreguntas({ temaNum = null, bloqueId = null, idsList = null, limite = 15, esSimulacro = false } = {}) {
      if (idsList && idsList.length === 0) return [];

      if (supabaseClient) {
        try {
          if (idsList && idsList.length > 0) {
            const { data, error } = await supabaseClient
              .from('preguntas')
              .select('*')
              .in('id', idsList)
              .limit(limite);
            if (error) throw error;
            return (data || []).sort(() => Math.random() - 0.5);
          }

          let idQuery = supabaseClient.from('preguntas').select('id, bloque_id, tema_num');
          if (temaNum) idQuery = idQuery.eq('tema_num', temaNum);
          if (bloqueId) idQuery = idQuery.eq('bloque_id', bloqueId);

          const { data: poolIds, error: poolError } = await idQuery;
          if (poolError) throw poolError;

          if (poolIds && poolIds.length > 0) {
            let selectedIds = [];

            if (esSimulacro) {
              const porBloque = {};
              poolIds.forEach(p => {
                const b = p.bloque_id || 1;
                if (!porBloque[b]) porBloque[b] = [];
                porBloque[b].push(p.id);
              });

              const bloques = Object.keys(porBloque);
              if (bloques.length > 1) {
                bloques.forEach(b => porBloque[b].sort(() => Math.random() - 0.5));
                const porcion = Math.ceil(limite / bloques.length);
                bloques.forEach(b => {
                  selectedIds.push(...porBloque[b].splice(0, porcion));
                });

                const restantes = poolIds
                  .map(p => p.id)
                  .filter(id => !selectedIds.includes(id))
                  .sort(() => Math.random() - 0.5);
                while (selectedIds.length < limite && restantes.length > 0) {
                  selectedIds.push(restantes.pop());
                }
                selectedIds = selectedIds.slice(0, limite).sort(() => Math.random() - 0.5);
              } else {
                selectedIds = poolIds.map(p => p.id).sort(() => Math.random() - 0.5).slice(0, limite);
              }
            } else {
              selectedIds = poolIds.map(p => p.id).sort(() => Math.random() - 0.5).slice(0, limite);
            }

            const { data: preguntasCompletas, error: fullError } = await supabaseClient
              .from('preguntas')
              .select('*')
              .in('id', selectedIds);

            if (fullError) throw fullError;
            if (preguntasCompletas && preguntasCompletas.length > 0) {
              return preguntasCompletas.sort(() => Math.random() - 0.5);
            }
          }
        } catch (err) {
          console.warn("Fallo Supabase, usando banco local:", err.message);
        }
      }

      let filtradas = [...MOCK_PREGUNTAS];
      if (idsList && idsList.length > 0) {
        filtradas = filtradas.filter(p => idsList.includes(p.id));
      } else {
        if (temaNum) filtradas = filtradas.filter(p => p.tema_num === temaNum);
        if (bloqueId) filtradas = filtradas.filter(p => p.bloque_id === bloqueId);
      }
      return filtradas.sort(() => Math.random() - 0.5).slice(0, limite);
    }

      const hash = window.location.hash.replace('#', '') || 'home';
      const [view, queryString] = hash.split('?');
      const urlParams = new URLSearchParams(queryString || '');

      state.currentView = view;
      if (urlParams.has('b')) state.selectedBloqueId = parseInt(urlParams.get('b'));
      if (urlParams.has('t')) state.selectedTemaNum = parseInt(urlParams.get('t'));

      updateSidebarActiveButtons(view);
      renderBreadcrumb(view);

      const viewport = document.getElementById('app-viewport');
      viewport.innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      switch (view) {
        case 'home':
          renderHome(viewport);
          break;
        case 'dashboard':
          renderDashboard(viewport);
          break;
        case 'bloque':
          renderBloqueView(viewport, state.selectedBloqueId);
          break;
        case 'tema':
          renderTemaView(viewport, state.selectedTemaNum);
          break;
        case 'test-center':
          renderTestCenter(viewport);
          break;
        case 'test-runner':
          renderTestRunner(viewport);
          break;
        case 'test-results':
          renderTestResults(viewport);
          break;
        default:
          renderHome(viewport);
      }
      lucide.createIcons();
    }

    function toggleAccordion(id) {

    function handleSearch(query) {
      const resultsContainer = document.getElementById('search-results');
      if (!query || query.trim().length < 2) {
        resultsContainer.classList.add('hidden');
        return;
      }
      
      const q = query.toLowerCase();
      let matches = [];

      TEMARIO.forEach(b => {
        b.temas.forEach(t => {
          const matchTitle = t.titulo.toLowerCase().includes(q);
          const matchNum = t.num.toString() === q.replace('tema', '').trim();
          const matchEpigrafe = t.epigrafes.some(e => e.toLowerCase().includes(q));
          
          if (matchTitle || matchNum || matchEpigrafe) {
            matches.push({ bloque: b, tema: t, disponible: esTemaDisponible(t.num) });
          }
        });
      });

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<div class="p-3 text-slate-400 text-xs text-center">No se encontraron temas coincidentes</div>`;
      } else {
        resultsContainer.innerHTML = matches.slice(0, 5).map(m => `
          <button 
            onclick="${m.disponible ? `navigate('tema', { temaNum: ${m.tema.num}, bloqueId: ${m.bloque.id} });` : `navigate('bloque', { bloqueId: ${m.bloque.id} });`} document.getElementById('search-results').classList.add('hidden');"
            class="w-full text-left p-2.5 hover:bg-slate-800/90 rounded-lg transition block"
          >
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <span class="font-semibold text-slate-200 text-xs truncate">T${m.tema.num}: ${m.tema.titulo}</span>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md ${m.disponible ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-slate-800 text-slate-400'}">
                ${m.disponible ? 'Disponible' : 'Próximamente'}
              </span>
            </div>
            <div class="text-[10px] text-slate-400 truncate">${m.bloque.nombre}</div>
          </button>
        `).join('');
      }
      resultsContainer.classList.remove('hidden');
    }

    async function cargarArchivoMarkdown(carpeta, temaNum) {
      const visor = document.getElementById('visor-tema');
      const rutas = [
        `${carpeta}/Tema_${temaNum}.md`,
        `${carpeta}/tema_${temaNum}.md`
      ];

      for (const ruta of rutas) {
        try {
          const res = await fetch(ruta);
          if (res.ok) {
            const markdown = await res.text();
            visor.innerHTML = marked.parse(markdown);
            if (window.MathJax && window.MathJax.typesetPromise) {
              window.MathJax.typesetPromise([visor]);
            }
            return;
          }
        } catch (e) {}
      }

      visor.innerHTML = `
        <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center space-y-3">

    async function lanzarTestTema(temaNum) {
      if (!esTemaDisponible(temaNum)) return;
      mostrarCargandoTest();
      const preguntas = await obtenerPreguntas({ temaNum, limite: 15 });
      startTestEngine('tema', preguntas, { temaNum });
    }

    async function lanzarTestBloque(bloqueId) {
      mostrarCargandoTest();
      const preguntas = await obtenerPreguntas({ bloqueId, limite: 30 });
      startTestEngine('bloque', preguntas, { bloqueId });
    }

    async function lanzarTestFallos() {
      mostrarCargandoTest();
      const idsFallados = await obtenerIdsFallosDesdeSupabase();
      
      if (idsFallados.length === 0) {
        startTestEngine('fallos', [], { esFallos: true });
        return;
      }

      const preguntas = await obtenerPreguntas({ idsList: idsFallados, limite: 20 });
      startTestEngine('fallos', preguntas, { esFallos: true });
    }

    async function lanzarSimulacro() {
      mostrarCargandoTest();
      const preguntas = await obtenerPreguntas({ limite: 60, esSimulacro: true });
      startTestEngine('simulacro', preguntas);
    }

    function startTestEngine(tipo, preguntas, meta = {}) {
      if (state.testTimerInterval) clearInterval(state.testTimerInterval);

      state.activeTest = {
        tipo,
        meta,
        preguntas: preguntas || [],
        indiceActual: 0,
        respuestas: {},
        segundos: 0,
        finalizado: false
      };

      navigate('test-runner');

      if (!preguntas || preguntas.length === 0) return;

      state.testTimerInterval = setInterval(() => {
        if (state.activeTest && !state.activeTest.finalizado) {
          state.activeTest.segundos++;
          const timerEl = document.getElementById('test-timer-display');
          if (timerEl) {
            const m = Math.floor(state.activeTest.segundos / 60);
            const s = state.activeTest.segundos % 60;
            timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          }
        }
      }, 1000);
    }

                  <span class="mt-0.5 leading-relaxed">${opc.replace(/^[A-D]\)\s*/, '')}</span>
                </button>
              `).join('')}
            </div>

            <div class="pt-2 flex justify-end">
              <button onclick="dejarEnBlanco()" class="text-xs text-slate-400 hover:text-slate-600 underline font-medium transition">
                Dejar en blanco
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <button 
              onclick="cambiarPregunta(${t.indiceActual - 1})"
              ${t.indiceActual === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-4 py-2 rounded-xl bg-slate-100 text-slate-400 text-xs font-semibold"' : 'class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center gap-1.5 shadow-soft transition"'}
            >
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Anterior
            </button>

            ${t.indiceActual < t.preguntas.length - 1 ? `
              <button 
                onclick="cambiarPregunta(${t.indiceActual + 1})"
                class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition active:scale-95"
              >
                Siguiente <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            ` : `
              <button 
                onclick="finalizarTest()"
                class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white text-xs font-bold flex items-center gap-2 shadow-md shadow-emerald-500/25 transition active:scale-95"
              >
                <i data-lucide="check-check" class="w-4 h-4"></i> Entregar Examen
              </button>
            `}
          </div>
        </div>
      `;

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
      lucide.createIcons();
    }

    function seleccionarOpcion(idx) {
      if (!state.activeTest) return;
      state.activeTest.respuestas[state.activeTest.indiceActual] = idx;
      renderTestRunner(document.getElementById('app-viewport'));
    }

    function dejarEnBlanco() {
      if (!state.activeTest) return;
      delete state.activeTest.respuestas[state.activeTest.indiceActual];
      renderTestRunner(document.getElementById('app-viewport'));
    }

    function cambiarPregunta(idx) {
      if (!state.activeTest || idx < 0 || idx >= state.activeTest.preguntas.length) return;
      state.activeTest.indiceActual = idx;
      renderTestRunner(document.getElementById('app-viewport'));
    }

    // 16. FINALIZACIÓN, DESGLOSE POR BLOQUES Y PERSISTENCIA HISTÓRICA
    async function finalizarTest() {
      if (!state.activeTest) return;
      clearInterval(state.testTimerInterval);
      state.activeTest.finalizado = true;

      const t = state.activeTest;
      let aciertos = 0;
      let fallos = 0;
      let blancos = 0;

      const idsFalladosSesion = [];
      const idsAcertadosSesion = [];
      const intentosLocales = [];

      const desgloseBloques = {
        1: { total: 0, aciertos: 0 },
        2: { total: 0, aciertos: 0 },
        3: { total: 0, aciertos: 0 },
        4: { total: 0, aciertos: 0 },
        5: { total: 0, aciertos: 0 },
        6: { total: 0, aciertos: 0 }
      };

      const primerPregunta = t.preguntas[0] || {};
      const temaDeducido = t.meta?.temaNum || primerPregunta.tema_num || null;
      const bloqueDeducido = t.meta?.bloqueId || primerPregunta.bloque_id || null;

      const detalles = t.preguntas.map((p, idx) => {
        const seleccion = t.respuestas[idx];
        const esBlanco = seleccion === undefined;
        const esAcierto = !esBlanco && seleccion === p.correcta;

        const bId = p.bloque_id && p.bloque_id >= 1 && p.bloque_id <= 6 ? p.bloque_id : (bloqueDeducido || 1);
        desgloseBloques[bId].total++;

        intentosLocales.push({
          pregunta_id: p.id,
          bloque_id: bId,
          tema_num: p.tema_num || temaDeducido,
          es_acierto: esAcierto,
          opcion_seleccionada: seleccion !== undefined ? seleccion : null,
          fecha: new Date().toISOString()
        });

        if (esBlanco) {
          blancos++;
        } else if (esAcierto) {
          aciertos++;
          idsAcertadosSesion.push(p.id);
          desgloseBloques[bId].aciertos++;
        } else {
          fallos++;
          idsFalladosSesion.push(p.id);
        }

        return { pregunta: p, seleccion, esAcierto, esBlanco };
      });

      guardarIntentosLocales(intentosLocales);

      const totalPreguntas = t.preguntas.length;
      const notaNeta = Math.max(0, (aciertos - (fallos / 3))).toFixed(2);
      const sobreDiez = totalPreguntas > 0 ? ((notaNeta / totalPreguntas) * 10).toFixed(2) : "0.00";
      const segundos = Math.max(1, t.segundos);
      const segPorPregunta = totalPreguntas > 0 ? (segundos / totalPreguntas).toFixed(1) : 0;

      let tipoDb = 'aleatorio';
      if (t.tipo === 'tema') tipoDb = 'tema';
      else if (t.tipo === 'bloque') tipoDb = 'bloque';
      else if (t.tipo === 'fallos') tipoDb = 'fallos';
      else if (t.tipo === 'semanal') tipoDb = 'semanal';

      let dbBloqueId = null;
      let dbTemaNum = null;

      if (t.tipo === 'tema') {
        dbTemaNum = t.meta?.temaNum ? Number(t.meta.temaNum) : (t.preguntas[0]?.tema_num || null);
        if (t.meta?.bloqueId) {
          dbBloqueId = Number(t.meta.bloqueId);
        } else if (dbTemaNum) {
          const bEncontrado = TEMARIO.find(b => b.temas.some(tema => tema.num === dbTemaNum));
          dbBloqueId = bEncontrado ? bEncontrado.id : (t.preguntas[0]?.bloque_id || null);
        }
      } else if (t.tipo === 'bloque') {
        dbBloqueId = t.meta?.bloqueId ? Number(t.meta.bloqueId) : (t.preguntas[0]?.bloque_id || null);
        dbTemaNum = null;
      } else {
        dbBloqueId = null;
        dbTemaNum = null;
      }

      const metaCompleta = {
        ...t.meta,
        bloqueId: dbBloqueId,
        temaNum: dbTemaNum
      };

      const nuevaSesion = {
        id: "sesion-" + Date.now(),
        fecha: new Date().toISOString(),
        tipo: t.tipo,
        meta: metaCompleta,
        total_preguntas: totalPreguntas,
        aciertos,
        fallos,
        blancos,
        nota: sobreDiez,
        tiempo_segundos: segundos,
        tiempo_por_pregunta: segPorPregunta,
        desgloseBloques
      };

      guardarSesionEnHistorialLocal(nuevaSesion);

      if (supabaseClient) {
        try {
          await supabaseClient.from('sesiones_test').insert([{
            tipo: tipoDb,
            total_preguntas: totalPreguntas,
            aciertos,
            fallos,
            blancos,
            tiempo_segundos: segundos,
            bloque_id: dbBloqueId,
            tema_num: dbTemaNum
          }]);

          const intentosAInsertar = t.preguntas
            .filter(p => p.id && !String(p.id).startsWith('mock-'))
            .map((p, idx) => {
              const sel = t.respuestas[idx];
              return {
                pregunta_id: p.id,
                es_acierto: sel !== undefined && sel === p.correcta,
                opcion_seleccionada: sel !== undefined ? sel : null
              };
            });

          if (intentosAInsertar.length > 0) {
            await supabaseClient.from('intentos').insert(intentosAInsertar);
          }
        } catch (e) {
          console.error("Error guardando sesión o intentos en Supabase:", e);
        }
      }

      await obtenerIdsFallosDesdeSupabase();

      state.metricasCargadas = false;
      state.activeTest.detalles = detalles;
      state.activeTest.stats = { aciertos, fallos, blancos };

      navigate('test-results');
    }

    // 17. GESTIÓN DE BOLSA DE FALLOS DESDE SUPABASE
    async function obtenerIdsFallosDesdeSupabase() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('intentos')
            .select('pregunta_id, es_acierto, creado_en')
            .order('creado_en', { ascending: true });

          if (!error && data) {
            const ultimosIntentos = new Map();
            data.forEach(it => {
              if (it.pregunta_id) {
                ultimosIntentos.set(it.pregunta_id, it.es_acierto);
              }
            });

            const idsFallados = [];
            ultimosIntentos.forEach((esAcierto, preguntaId) => {
              if (!esAcierto) {
                idsFallados.push(preguntaId);
              }
            });

            state.fallosIdsSupabase = idsFallados;
            return idsFallados;
          }
        } catch (e) {
          console.warn("Fallo obteniendo bolsa de fallos de Supabase, usando respaldo local:", e);
        }
      }

      const locales = obtenerIntentosLocales();
      const ultimosLocales = new Map();
      [...locales].reverse().forEach(it => {
        if (it.pregunta_id) {
          ultimosLocales.set(it.pregunta_id, it.es_acierto);
        }
      });

      const idsLocales = [];
      ultimosLocales.forEach((esAcierto, id) => {
        if (!esAcierto) idsLocales.push(id);
      });

      state.fallosIdsSupabase = idsLocales;
      return idsLocales;
    }

    function obtenerSesionesHistorial() {
      try {
        const raw = localStorage.getItem('oposicion_historial_sesiones');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function guardarSesionEnHistorialLocal(sesion) {
      const historial = obtenerSesionesHistorial();
      historial.unshift(sesion);
      localStorage.setItem('oposicion_historial_sesiones', JSON.stringify(historial.slice(0, 100)));
    }

    function obtenerIntentosLocales() {
      try {
        const raw = localStorage.getItem('oposicion_intentos_locales');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function guardarIntentosLocales(nuevosIntentos) {
      if (!nuevosIntentos || nuevosIntentos.length === 0) return;
      const actuales = obtenerIntentosLocales();
      const actualizados = [...nuevosIntentos, ...actuales].slice(0, 500);
      localStorage.setItem('oposicion_intentos_locales', JSON.stringify(actualizados));
    }

    function borrarHistorialTests() {
      if (confirm("¿Estás seguro de que deseas reiniciar el histórico local de tests?")) {
        localStorage.removeItem('oposicion_historial_sesiones');
        localStorage.removeItem('oposicion_intentos_locales');
        state.metricasCargadas = false;
        renderDashboard(document.getElementById('app-viewport'));
      }
    }

    function formatearTiempo(segundosTotales) {
      const s = Math.round(segundosTotales);
      const m = Math.floor(s / 60);
      const seg = s % 60;
      if (m < 60) {
        return `${String(m).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
      }
      const h = Math.floor(m / 60);
      const min = m % 60;
      return `${h}h ${min}m`;
    }

    function formatearFecha(isoString) {
      try {
        const d = new Date(isoString);
        return d.toLocaleDateString('es-ES', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return 'Reciente';
      }
    }

    function etiquetaTipoTest(tipo, meta = {}) {
      switch (tipo) {
        case 'simulacro':
        case 'aleatorio':
          return { texto: 'Simulacro Oficial', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' };
        case 'bloque':
          return { texto: meta.bloqueId ? `Bloque ${meta.bloqueId}` : 'Por Bloque', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
        case 'tema':
          return { texto: meta.temaNum ? `Tema ${meta.temaNum}` : 'Por Tema', color: 'bg-brand-50 text-brand-700 border-brand-200' };
        case 'fallos':
          return { texto: 'Bolsa de Fallos', color: 'bg-rose-50 text-rose-700 border-rose-200' };
        case 'semanal':
          return { texto: 'Test Semanal', color: 'bg-purple-50 text-purple-700 border-purple-200' };
        default:
          return { texto: 'Test Oficial', color: 'bg-slate-100 text-slate-700 border-slate-200' };
      }
    }

    function descripcionMateriaTest(tipo, meta = {}) {
      if (tipo === 'simulacro' || tipo === 'aleatorio') {
        return 'Simulacro General Oficial (Bloques 1 al 6)';
      }
      if (tipo === 'fallos') {
        return 'Bolsa de Fallos (Repaso de preguntas con error previo)';
      }
      if (tipo === 'bloque') {
        const bId = meta?.bloqueId;
        const b = TEMARIO.find(x => x.id === Number(bId));
        return b ? `Bloque ${b.id}: ${b.nombre}` : (bId ? `Bloque ${bId}` : 'Test de Bloque Completo');
      }
      if (tipo === 'tema') {
        const tNum = meta?.temaNum;
        if (tNum) {
          const bloque = TEMARIO.find(x => x.temas.some(t => t.num === Number(tNum)));
          const tema = bloque?.temas.find(t => t.num === Number(tNum));
          if (tema) {
            return `Tema ${tema.num}: ${tema.titulo} (Bloque ${bloque.id})`;
          }
          return `Tema ${tNum}`;
        }
        return 'Test por Tema Oficial';
      }
      return 'Test transversal';
    }

    // 19. VISTA: DASHBOARD DE MÉTRICAS, RENDIMIENTO Y NUEVO HISTORIAL
    async function cargarMetricasReales() {
      let sesiones = [];
      const aciertosBloques = [0, 0, 0, 0, 0, 0];
      const totalesBloques = [0, 0, 0, 0, 0, 0];
      let intentosProcesados = 0;

      await obtenerIdsFallosDesdeSupabase();

      if (supabaseClient) {
        try {
          const { data: sesionesDb, error: errSesiones } = await supabaseClient
            .from('sesiones_test')
            .select('*')
            .order('creado_en', { ascending: false });

          if (!errSesiones && sesionesDb && sesionesDb.length > 0) {
            sesiones = sesionesDb.map(s => {
              const total = s.total_preguntas || 0;
              const ac = s.aciertos || 0;
              const fl = s.fallos || 0;
              const bl = s.blancos || 0;
              const notaNeta = Math.max(0, ac - (fl / 3));
              const nota = total > 0 ? ((notaNeta / total) * 10).toFixed(2) : "0.00";
              const segs = s.tiempo_segundos || 0;
              const segPorP = total > 0 ? (segs / total).toFixed(1) : 0;

              const metaExtraida = {
                bloqueId: s.bloque_id !== undefined ? s.bloque_id : null,
                temaNum: s.tema_num !== undefined ? s.tema_num : null
              };

              if (!metaExtraida.temaNum && !metaExtraida.bloqueId && (s.tipo === 'tema' || s.tipo === 'bloque')) {
                const matchLocal = obtenerSesionesHistorial().find(l => 
                  l.total_preguntas === total && l.aciertos === ac && l.fallos === fl && (l.meta?.temaNum || l.meta?.bloqueId)
                );
                if (matchLocal) {
                  metaExtraida.bloqueId = matchLocal.meta?.bloqueId || null;
                  metaExtraida.temaNum = matchLocal.meta?.temaNum || null;
                }
              }

              return {
                id: s.id,
                fecha: s.creado_en,
                tipo: s.tipo === 'aleatorio' ? 'simulacro' : s.tipo,
                meta: metaExtraida,
                total_preguntas: total,
                aciertos: ac,
                fallos: fl,
                blancos: bl,
                nota: nota,
                tiempo_segundos: segs,
                tiempo_por_pregunta: segPorP
              };
            });
          }

          const { data: intentosDb, error: errIntentos } = await supabaseClient
            .from('intentos')
            .select(`
              es_acierto,
              preguntas!inner (
                bloque_id
              )
            `);

          if (!errIntentos && intentosDb && intentosDb.length > 0) {
            intentosDb.forEach(it => {
              const bId = it.preguntas?.bloque_id;
              if (bId && bId >= 1 && bId <= 6) {
                totalesBloques[bId - 1]++;
                if (it.es_acierto) {
                  aciertosBloques[bId - 1]++;
                }
                intentosProcesados++;
              }
            });
          } else if (errIntentos) {
            console.warn("Consulta a intentos con relación falló, probando consulta plana:", errIntentos.message);
            const { data: dbPreguntas } = await supabaseClient.from('preguntas').select('id, bloque_id');
            const { data: rawIntentos } = await supabaseClient.from('intentos').select('pregunta_id, es_acierto');
            if (rawIntentos && dbPreguntas) {
              const mapaP = new Map();
              dbPreguntas.forEach(p => mapaP.set(p.id, p.bloque_id));
              rawIntentos.forEach(it => {
                const bId = mapaP.get(it.pregunta_id);
                if (bId && bId >= 1 && bId <= 6) {
                  totalesBloques[bId - 1]++;
                  if (it.es_acierto) aciertosBloques[bId - 1]++;
                  intentosProcesados++;
                }
              });
            }
          }
        } catch (e) {
          console.warn("Fallo cargando métricas desde Supabase:", e);
        }
      }

      const localHistorial = obtenerSesionesHistorial();
      if (intentosProcesados === 0 && localHistorial.length > 0) {
        localHistorial.forEach(s => {
          if (s.desgloseBloques) {
            for (let b = 1; b <= 6; b++) {
              if (s.desgloseBloques[b]) {
                totalesBloques[b - 1] += s.desgloseBloques[b].total || 0;
                aciertosBloques[b - 1] += s.desgloseBloques[b].aciertos || 0;
              }
            }
          }
        });
      }

      if (sesiones.length === 0 && localHistorial.length > 0) {
        sesiones = localHistorial;
      }

      state.sesionesHistorial = sesiones;

      let totalTests = sesiones.length;
      let totalIntentos = 0;
      let aciertos = 0;
      let fallos = 0;
      let blancos = 0;
      let tiempoTotalSegundos = 0;

      sesiones.forEach(s => {
        totalIntentos += (s.total_preguntas || 0);
        aciertos += (s.aciertos || 0);
        fallos += (s.fallos || 0);
        blancos += (s.blancos || 0);
        tiempoTotalSegundos += (s.tiempo_segundos || 0);
      });

      const porBloque = totalesBloques.map((tot, idx) => {
        return tot > 0 ? Math.round((aciertosBloques[idx] / tot) * 100) : 0;
      });

      const tiempoMedioPorTest = totalTests > 0 ? Math.round(tiempoTotalSegundos / totalTests) : 0;
      const tiempoMedioPorPregunta = totalIntentos > 0 ? (tiempoTotalSegundos / totalIntentos).toFixed(1) : 0;

      state.metricas = {
        totalTests,
        totalIntentos,
        aciertos,
        fallos,
        blancos,
        tiempoTotalSegundos,
        tiempoMedioPorTest,
        tiempoMedioPorPregunta,
        porBloque,
        preguntasTotalesPorBloque: totalesBloques,
        aciertosPorBloque: aciertosBloques

      lista.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

                  </div>

                  <div class="flex items-center gap-1.5">
                    <span class="text-slate-400 font-medium text-[11px]">Tema:</span>
                    <select 
                      id="select-timeline-tema" 
                      onchange="cambiarFiltroTimelineTema(this.value)"
                      class="bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none"
                    >
                      <option value="all" ${state.timelineFiltroTema === 'all' ? 'selected' : ''}>Todos los temas</option>
                      ${temasParaSelect.map(t => `
                        <option value="${t.num}" ${state.timelineFiltroTema === String(t.num) ? 'selected' : ''}>
                          Tema ${t.num}: ${t.titulo.substring(0, 22)}...
                        </option>
                      `).join('')}
                    </select>
                  </div>
                </div>

                <div class="flex items-center gap-3 text-[11px] font-medium text-slate-600">
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> % Aciertos</span>
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> % Fallos</span>
                </div>
              </div>

              <!-- Cuerpo con Canvas -->
              <div class="p-5 sm:p-6 overflow-y-auto flex-1" id="timeline-modal-body">
                <div class="relative w-full h-80">
                  <canvas id="chart-timeline"></canvas>
                </div>
                <div id="timeline-modal-empty" class="hidden py-16 border-2 border-dashed border-slate-200 rounded-2xl text-center space-y-2">
                  <div class="mx-auto w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                  </div>
                  <p class="text-sm font-semibold text-slate-700">Sin sesiones para el filtro seleccionado</p>
                  <p class="text-xs text-slate-500 max-w-sm mx-auto">
                    Prueba a seleccionar "Todos los bloques" o completa un test de esta categoría para ver su evolución cronológica.
                  </p>
                </div>
                <div id="timeline-modal-footer-stats" class="mt-3 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-100 pt-2 font-mono">
                  <span>Escala fija de 0% a 100%</span>
                  <span id="timeline-modal-count-text">Mostrando 0 sesión(es)</span>
                </div>
              </div>

              <!-- Pie de modal -->
              <div class="px-5 sm:px-6 py-3 border-t border-slate-100 flex justify-end bg-slate-50/50">
                <button 
                  onclick="cerrarModalEvolutivo()" 
                  class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-semibold rounded-xl transition"
                >
                  Cerrar
                </button>
              </div>

            </div>
          </div>

        </div>
      `;

      lucide.createIcons();

      // Renderizado de gráfico por bloques
      const totalPreguntasGrafico = m.preguntasTotalesPorBloque.reduce((a, b) => a + b, 0);
      if (totalPreguntasGrafico > 0) {
        setTimeout(() => {
          const ctx = document.getElementById('chart-bloques');
          if (ctx) {
            if (bloquesChartInstance) {
              bloquesChartInstance.destroy();
            }

            bloquesChartInstance = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: [
                  'B.I Administrativo', 
                  'B.II Estadística', 
                  'B.III Economía', 
                  'B.IV Demografía', 
                  'B.V Muestreo', 
                  'B.VI Informática'
                ],
                datasets: [{
                  label: '% de Acierto',
                  data: m.porBloque,
                  backgroundColor: [
                    'rgba(12, 135, 235, 0.85)',
                    'rgba(99, 102, 241, 0.85)',
                    'rgba(16, 185, 129, 0.85)',
                    'rgba(245, 158, 11, 0.85)',
                    'rgba(236, 72, 153, 0.85)',
                    'rgba(14, 165, 233, 0.85)'
                  ],
                  borderColor: [
                    '#0c87eb',
                    '#6366f1',
                    '#10b981',
                    '#f59e0b',
                    '#ec4899',
                    '#0ea5e9'
                  ],
                  borderWidth: 1.5,
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        const idx = context.dataIndex;
                        const pct = context.parsed.y;
                        const ac = m.aciertosPorBloque[idx] || 0;
                        const tot = m.preguntasTotalesPorBloque[idx] || 0;
                        return ` Acierto: ${pct}% (${ac} de ${tot} preguntas)`;
                      }
                    }
                  }
                },
                scales: {
                  y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                      callback: function(v) { return v + '%'; },
                      stepSize: 20,
                      font: { family: '"Plus Jakarta Sans", sans-serif', size: 11 }
                    },
                    grid: { color: 'rgba(226, 232, 240, 0.6)' }
                  },
                  x: {
                    ticks: {
                      font: { family: '"Plus Jakarta Sans", sans-serif', size: 11, weight: '500' }
                    },
                    grid: { display: false }
                  }
                }
              }
            });
          }
        }, 60);
      }
    }

    function abrirModalEvolutivo() {
      const modal = document.getElementById('modal-evolutivo');
      if (!modal) return;
      modal.classList.remove('hidden');
      lucide.createIcons();
      actualizarSelectoresModalTimeline();
      renderChartTimelineModal();
    }

    function cerrarModalEvolutivo() {
      const modal = document.getElementById('modal-evolutivo');
      if (modal) {
        modal.classList.add('hidden');
      }
    }

    function renderChartTimelineModal() {
      const datosTimeline = obtenerSesionesParaTimeline();
      const canvasContainer = document.querySelector('#modal-evolutivo .relative.w-full');
      const emptyContainer = document.getElementById('timeline-modal-empty');
      const statsFooter = document.getElementById('timeline-modal-footer-stats');
      const countText = document.getElementById('timeline-modal-count-text');

      if (datosTimeline.length === 0) {
        if (timelineChartInstance) {
          timelineChartInstance.destroy();
          timelineChartInstance = null;
        }
        if (canvasContainer) canvasContainer.classList.add('hidden');
        if (emptyContainer) emptyContainer.classList.remove('hidden');
        if (statsFooter) statsFooter.classList.add('hidden');
        lucide.createIcons();
        return;
      }

      if (canvasContainer) canvasContainer.classList.remove('hidden');
      if (emptyContainer) emptyContainer.classList.add('hidden');
      if (statsFooter) statsFooter.classList.remove('hidden');
      if (countText) countText.textContent = `Mostrando ${datosTimeline.length} sesión(es) en este filtro`;

      const ctxTimeline = document.getElementById('chart-timeline');
      if (!ctxTimeline) return;

      if (timelineChartInstance) {
        timelineChartInstance.destroy();
      }

      const labelsTimeline = datosTimeline.map((s, idx) => {
        const d = new Date(s.fecha);
        const diaMes = d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
        const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        return `#${idx + 1} (${diaMes} ${hora})`;
      });

      const pctAciertosData = datosTimeline.map(s => {
        const tot = s.total_preguntas || 1;
        return Math.round(((s.aciertos || 0) / tot) * 100);
      });

      const pctFallosData = datosTimeline.map(s => {
        const tot = s.total_preguntas || 1;
        return Math.round(((s.fallos || 0) / tot) * 100);
      });

      timelineChartInstance = new Chart(ctxTimeline, {
        type: 'line',
        data: {
          labels: labelsTimeline,
          datasets: [
            {
              label: '% Aciertos',
              data: pctAciertosData,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.12)',
              fill: false,
              tension: 0.35,
              borderWidth: 2.5,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#10b981'
            },
            {
              label: '% Fallos',
              data: pctFallosData,
              borderColor: '#f43f5e',
              backgroundColor: 'rgba(244, 63, 94, 0.12)',
              fill: false,
              tension: 0.35,
              borderWidth: 2.5,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#f43f5e'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                boxWidth: 12,
                font: { family: '"Plus Jakarta Sans", sans-serif', size: 11, weight: '600' }
              }
            },
            tooltip: {
              callbacks: {
                title: function(items) {
                  const idx = items[0].dataIndex;
                  const sesion = datosTimeline[idx];
                  return `Sesión ${idx + 1} • ${formatearFecha(sesion.fecha)}`;
                },
                label: function(context) {
                  const idx = context.dataIndex;
                  const s = datosTimeline[idx];
                  const tot = s.total_preguntas || 0;
                  const val = context.parsed.y;
                  if (context.datasetIndex === 0) {
                    return ` % Aciertos: ${val}% (${s.aciertos || 0} de ${tot} P)`;
                  } else {
                    return ` % Fallos: ${val}% (${s.fallos || 0} de ${tot} P)`;
                  }
                },
                afterBody: function(items) {
                  const idx = items[0].dataIndex;
                  const sesion = datosTimeline[idx];
                  const materia = descripcionMateriaTest(sesion.tipo, sesion.meta);
                  return `Materia: ${materia}\nTiempo: ${formatearTiempo(sesion.tiempo_segundos)}`;
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              min: 0,
              max: 100,
              title: {
                display: true,
                text: 'Porcentaje (%)',
                font: { family: '"Plus Jakarta Sans", sans-serif', size: 10 }
              },
              grid: { color: 'rgba(226, 232, 240, 0.6)' },
              ticks: {
                stepSize: 20,
                callback: function(v) { return v + '%'; },
                font: { family: '"Plus Jakarta Sans", sans-serif', size: 10 }
              }
            },
            x: {
              grid: { display: false },
              ticks: {
                maxRotation: 45,
                minRotation: 0,
                font: { family: '"Plus Jakarta Sans", sans-serif', size: 10 }
              }
            }
          }
        }
      });
    }

    // 20. INICIALIZACIÓN
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
